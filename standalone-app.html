    // --- WHATSAPP & PHONE HELPERS (PREFIX +62 -> LANGSUNG ANGKA 8) ---
    function normalizePhone(p) {
      if (!p) return '';
      let d = String(p).replace(/\D/g, '');
      if (d.startsWith('62')) d = d.slice(2);
      while (d.startsWith('0')) d = d.slice(1);
      return d;
    }

    function formatPhone(p) {
      const d = normalizePhone(p);
      if (!d) return '';
      if (d.length <= 3) return d;
      if (d.length <= 7) return `${d.slice(0, 3)}-${d.slice(3)}`;
      return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7, 12)}`;
    }

    function validatePhone12(p) {
      const d = normalizePhone(p);
      if (!d) return { isValid: false, msg: 'Nomor WhatsApp wajib diisi.', len: 0, d: '' };
      if (!d.startsWith('8')) return { isValid: false, msg: 'Nomor setelah +62 harus langsung diawali angka 8 (contoh: 812-xxxx-xxxx). Tidak perlu mengetik 0 lagi.', len: d.length, d };
      if (d.length < 10 || d.length > 12) {
        return { isValid: false, msg: `Nomor setelah +62 harus 10-12 digit (standar resmi 11 digit). Saat ini: ${d.length} digit.`, len: d.length, d };
      }
      const prefix = d.slice(0, 3);
      const validPrefixes = [
        '811','812','813','814','815','816','817','818','819',
        '821','822','823',
        '831','832','833','838',
        '851','852','853','855','856','857','858','859',
        '877','878',
        '881','882','883','884','885','886','887','888','889',
        '895','896','897','898','899'
      ];
      if (!validPrefixes.includes(prefix)) {
        return { isValid: false, msg: `Prefix operator "0${prefix}" tidak dikenal sebagai operator resmi Indonesia.`, len: d.length, d };
      }
      return { isValid: true, msg: 'Nomor WhatsApp resmi valid.', len: d.length, d };
    }

        const saved = localStorage.getItem('sip_complaints_v2');
        return saved ? JSON.parse(saved) : initialComplaints;
      });
      const [users, setUsers] = useState(() => {
        try {
          const saved = localStorage.getItem('sip_users_v4');
          if (saved) {
            const parsed = JSON.parse(saved);
            return parsed.map(u => ({
              ...u,
              password: u.password || OFFICIAL_PASSWORDS[u.username.toLowerCase()] || 'password123'
            }));
          }
        } catch (e) {}
        return initialUsers;
      });
      const [auditLogs, setAuditLogs] = useState(() => {
        const saved = localStorage.getItem('sip_audit_v2');
        return saved ? JSON.parse(saved) : initialAuditLogs;
      });
      const [config, setConfig] = useState({
        kelurahanName: "Kelurahan Airmadidi Atas",
        apiNotifikasi: "API Notifikasi (WA / SMS)",
        fileLimit: "Limit ukuran file: 10MB",
        alamatKantor: "Jl. Raya Airmadidi Atas No. 12, Minahasa Utara",
        hotline: "0812-4400-5511"
      });

      const [view, setView] = useState('citizen-form');
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('');
      const [trackId, setTrackId] = useState('ADU-2026-0001');
      const [toastMsg, setToastMsg] = useState('');
      const [isBackendOnline, setIsBackendOnline] = useState(false);
      const [waModal, setWaModal] = useState({ open: false, complaint: null, type: 'terima' });

      const openWa = (complaint, type = 'terima') => {
        setWaModal({ open: true, complaint, type });
      };

      useEffect(() => {
        localStorage.setItem('sip_complaints_v2', JSON.stringify(complaints));
      }, [complaints]);

      useEffect(() => {
        localStorage.setItem('sip_users_v4', JSON.stringify(users));
      }, [users]);

      // Check backend health
      useEffect(() => {
        const checkBackend = async () => {
          try {
            const res = await fetch('http://localhost:5000/api/health');
            if (res.ok) {
              setIsBackendOnline(prev => prev === true ? prev : true);
              const cRes = await fetch('http://localhost:5000/api/complaints');
              if (cRes.ok) {
                const cData = await cRes.json();
                if (cData.data && cData.data.length > 0) {
                  setComplaints(prev => {
                    if (prev && prev.length === cData.data.length && prev[0]?.id === cData.data[0]?.id) {
                      return prev; // Identik, jangan picu re-render
                    }
                    return cData.data;
                  });
                }
              }
            } else {
              setIsBackendOnline(prev => prev === false ? prev : false);
            }
          } catch (e) {
            setIsBackendOnline(prev => prev === false ? prev : false);
          }
        };
        checkBackend();
        const interval = setInterval(checkBackend, 30000);
        return () => clearInterval(interval);
      }, []);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const addAudit = (act, user = currentUser?.username || 'Warga') => {
        const d = new Date();
        const time = `${String(d.getHours()).padStart(2, '0')}.${String(d.getMinutes()).padStart(2, '0')}`;
        setAuditLogs(prev => [{ id: Date.now(), aktivitas: act, user, waktu: time }, ...prev]);
      };

      const handleCitizenSubmit = async (form) => {
        if (isBackendOnline) {
          try {
            const res = await fetch('http://localhost:5000/api/complaints', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(form)
            });
            if (res.ok) {
              const resData = await res.json();
              setComplaints(prev => [resData.data, ...prev]);
              setTrackId(resData.ticketId);
              notify(`Pengaduan tersimpan di database server! Nomor: ${resData.ticketId}`);
              return resData.ticketId;
            }
          } catch (e) { }
        }

        const num = Math.floor(1000 + Math.random() * 9000);
        const newId = `ADU-2026-${num}`;
        const shortId = `ADU-${String(complaints.length + 1).padStart(4, '0')}`;
        const item = {
          id: newId,
          shortId: shortId,
          nama: form.nama,
          kontak: form.kontak,
          lokasi: form.lokasi,
          detail: form.detail,
          kategori: "Infrastruktur & Lingkungan",
          tujuanDisposisi: "Seksi Pembangunan",
          catatanDisposisi: "",
          status: "Baru",
          petugas: "Belum Ditugaskan",
          timerSla: "Sisa 3 hari",
          isOverdue: false,
          prioritas: "Sedang",
          fotoUrl: form.fotoUrl || null,
          catatanProgres: "",
          buktiPenyelesaian: null,
          buktiFotoUrl: null,
          tanggapanResmi: "",
          rating: 0,
          ulasan: "",
          createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16)
        };
        setComplaints(prev => [item, ...prev]);
        setTrackId(newId);
        addAudit(`Pengaduan baru ${newId}`, form.nama);
        notify(`Pengaduan tersimpan! Nomor Tiket: ${newId}`);
        return newId;
      };

      const handleLogin = (roleLabel, username, inputPassword) => {
        const cleanUser = (username || '').trim().toLowerCase();
        const cleanPass = (inputPassword || '').trim();

        // Cari akun pengguna berdasarkan username di state atau fallback ke initialUsers
        let targetUser = users.find(u => u.username.toLowerCase() === cleanUser);
        if (!targetUser) {
          targetUser = initialUsers.find(u => u.username.toLowerCase() === cleanUser);
        }

        if (!targetUser) {
          return {
            success: false,
            message: `Username '${username}' tidak terdaftar dalam sistem kelurahan.`
          };
        }

        if (targetUser.status === 'Nonaktif') {
          return {
            success: false,
            message: 'Akun Anda sedang dinonaktifkan oleh administrator.'
          };
        }

        // Ambil kata sandi resmi yang diharapkan untuk username ini
        const expectedPassword = OFFICIAL_PASSWORDS[cleanUser] || targetUser.password;

        // Pengecekan kata sandi khusus
        if (!cleanPass || cleanPass !== expectedPassword) {
          return {
            success: false,
            message: `Kata sandi salah! Akun ${targetUser.nama} (${targetUser.username}) memiliki kata sandi khusus tersendiri. Anda tidak dapat login menggunakan kata sandi akun lain.`
          };
        }

        let rKey = targetUser.roleKey || 'front_office';
        let targetView = 'front-office';
        let tab = 'Pengaduan Masuk';

        if (targetUser.role === 'Petugas Tindak Lanjut' || targetUser.role === 'Tindak Lanjut' || rKey === 'field_officer') {
          rKey = 'field_officer';
          targetView = 'field-officer';
          tab = 'Disposisi Masuk';
        } else if (targetUser.role === 'Kepala Seksi' || targetUser.role === 'Kepala Seksi (Kasie)' || rKey === 'section_head') {
          rKey = 'section_head';
          targetView = 'section-head';
          tab = 'Pemantauan Seksi';
        } else if (targetUser.role === 'Lurah / Seklur' || targetUser.role === 'Lurah / Sekretaris Lurah' || rKey === 'leader') {
          rKey = 'leader';
          targetView = 'leader-dashboard';
          tab = 'Dashboard Statistik';
        } else if (targetUser.role === 'Administrator Sistem' || targetUser.role === 'Administrator' || rKey === 'admin') {
          rKey = 'admin';
          targetView = 'admin';
          tab = 'Manajemen Akun';
        }

        setCurrentUser({ nama: targetUser.nama, username: targetUser.username, role: targetUser.role, roleKey: rKey });
        setView(targetView);
        setActiveTab(tab);
        addAudit('Login berhasil', targetUser.username);
        notify(`Selamat datang, ${targetUser.nama} (${targetUser.role})!`);
        return { success: true };
      };

      const handleQuickSwitch = (username) => {
        const u = users.find(x => x.username === username);
        if (u) {
          handleLogin(u.role, u.username, u.password);
        }
      };

      // --- NAVBAR COMPONENT ---
      function NavbarComponent() {
        return (
          <header className="bg-[#0e3d46] text-white px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <button onClick={() => setView('citizen-form')} className="flex items-center gap-3 text-left focus:outline-none">
                <div className="w-8 h-8 rounded-lg bg-[#f59e0b] flex items-center justify-center text-slate-900 font-bold shadow-sm">
                  <svg className="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                  </svg>
                </div>
                <span className="font-bold text-lg tracking-tight text-white hover:text-amber-200 transition">
                  SIP-Publik Airmadidi Atas
                </span>
              </button>
              <span className={`hidden sm:inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold transition ${isBackendOnline ? 'bg-emerald-900/60 text-emerald-200 border border-emerald-500/40' : 'bg-slate-800 text-slate-400 border border-slate-700'}`}>
                <span className={`w-1.5 h-1.5 rounded-full ${isBackendOnline ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`} />
                {isBackendOnline ? 'Backend: Online (Port 5000)' : 'Backend: Offline (Lokal)'}
              </span>
            </div>

            <nav className="flex items-center gap-6 text-sm font-medium">
              <button
                onClick={() => setView('citizen-form')}
                className={`py-1 transition ${view === 'citizen-form' ? 'text-white font-bold border-b-2 border-white' : 'text-white/80 hover:text-white'}`}
              >
                Ajukan Pengaduan
              </button>
              <button
                onClick={() => setView('citizen-tracking')}
                className={`py-1 transition ${view === 'citizen-tracking' ? 'text-white font-bold border-b-2 border-white' : 'text-white/80 hover:text-white'}`}
              >
                Lacak Status
              </button>
              {currentUser ? (
                <button
                  onClick={() => {
                    if (currentUser.roleKey === 'front_office') { setView('front-office'); setActiveTab('Pengaduan Masuk'); }
                    else if (currentUser.roleKey === 'field_officer') { setView('field-officer'); setActiveTab('Disposisi Masuk'); }
                    else if (currentUser.roleKey === 'section_head') { setView('section-head'); setActiveTab('Pemantauan Seksi'); }
                    else if (currentUser.roleKey === 'leader') { setView('leader-dashboard'); setActiveTab('Dashboard Statistik'); }
                    else { setView('admin'); setActiveTab('Manajemen Akun'); }
                  }}
                  className="px-3 py-1.5 rounded-lg bg-[#18535f] hover:bg-[#134953] text-xs font-semibold text-white"
                >
                  Panel {currentUser.role}
                </button>
              ) : (
                <button
                  onClick={() => setView('login')}
                  className={`py-1 transition ${view === 'login' ? 'text-white font-bold border-b-2 border-white' : 'text-white/80 hover:text-white'}`}
                >
                  Login Petugas
                </button>
              )}
            </nav>
          </header>
        );
      }

      function SidebarComponent({ roleTitle, menuItems, activeItem, onSelect }) {
        return (
          <aside className="w-64 bg-[#0e3d46] text-white flex flex-col min-h-screen shrink-0 border-r border-[#164d57]">

      // --- SCREEN 1: LOGIN PETUGAS (KATA SANDI KHUSUS TIAP PETUGAS) ---
      function ScreenLogin() {

        const [username, setUsername] = useState('petugas.a');

                <div className="flex items-center gap-3 mb-16">
                  <div className="w-12 h-12 rounded-xl bg-[#f59e0b] flex items-center justify-center text-slate-900 shadow-md">
                    <svg className="w-7 h-7 text-white" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                  </div>
                  <div>
                    <h2 className="text-xl font-bold tracking-tight text-white leading-tight">SIP-Publik</h2>
                    <p className="text-sm text-emerald-200/90 font-medium">Kelurahan Airmadidi Atas</p>
                  </div>
                </div>

                <div className="max-w-md">
                  <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight text-white leading-[1.15] mb-6">
                    Satu pintu layanan pengaduan warga.
                  </h1>
                  <p className="text-emerald-100/80 text-base md:text-lg leading-relaxed font-normal">
                    Verifikasi, disposisi, tindak lanjut, hingga penutupan aduan tercatat transparan dan dapat dilacak.

                </div>
              </div>

              <div className="pt-12 flex flex-wrap gap-2.5">
                {['Verifikasi', 'Disposisi', 'Tindak Lanjut', 'Approval'].map((tag) => (
                  <span key={tag} className="px-4 py-1.5 rounded-full text-xs font-semibold bg-[#164d57]/70 text-emerald-100 border border-[#216674]/80 shadow-sm">
                    {tag}
                  </span>
                ))}
              </div>

            <div className="w-full md:w-7/12 bg-[#f7f5ee] flex items-center justify-center p-8 md:p-14 overflow-y-auto">
              <div className="w-full max-w-md space-y-6">
                <div>
                  <h2 className="text-3xl font-bold text-slate-900 tracking-tight mb-2">Masuk Petugas</h2>
                  <p className="text-sm text-slate-600">Gunakan akun & kata sandi khusus masing-masing petugas.</p>
                </div>

                {errorMsg && (
                  <div className="p-4 bg-rose-50 border border-rose-300 rounded-xl text-rose-900 text-xs flex items-start gap-3 shadow-sm animate-pulse">

      // --- SCREEN 2: AJUKAN PENGADUAN (WARGA) ---
      function ScreenCitizenForm() {
        // Ambil draft dari localStorage agar data pengisian tidak pernah hilang secara tiba-tiba
        const [formData, setFormData] = useState(() => {
          try {
            const saved = localStorage.getItem('sip_citizen_form_draft');
            return saved ? JSON.parse(saved) : {
              nama: '',
              kontak: '',
              lokasi: '',
              detail: '',
              fotoUrl: null
            };
          } catch (e) {
            return {
              nama: '',
              kontak: '',
              lokasi: '',
              detail: '',
              fotoUrl: null
            };
          }
        });

        const [lastTicket, setLastTicket] = useState(null);
        const [submittedData, setSubmittedData] = useState(null);
        const [phoneTouched, setPhoneTouched] = useState(false);

        // Simpan otomatis setiap ketikan ke localStorage
        useEffect(() => {
          try {
            localStorage.setItem('sip_citizen_form_draft', JSON.stringify(formData));
          } catch (e) {}
        }, [formData]);

        const phoneCheck = validatePhone12(formData.kontak);

        const handlePhoneInput = (val) => {
          setPhoneTouched(true);
          const raw = normalizePhone(val).slice(0, 12);
          const formatted = formatPhone(raw);
          setFormData(prev => ({ ...prev, kontak: formatted }));
        };

        const handleImageSelect = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => {
              setFormData(prev => ({ ...prev, fotoUrl: reader.result }));
            };
            reader.readAsDataURL(file);
          }
        };

        const handleReset = () => {
          const empty = { nama: '', kontak: '', lokasi: '', detail: '', fotoUrl: null };
          setFormData(empty);
          try {
            localStorage.removeItem('sip_citizen_form_draft');
          } catch (e) {}
          setPhoneTouched(false);
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          const check = validatePhone12(formData.kontak);
          if (!check.isValid) {
            setPhoneTouched(true);
            alert(`Format Nomor WhatsApp Tidak Valid:\n${check.msg}`);
            return;
          }
          if (!formData.nama.trim() || !formData.detail.trim()) {
            alert('Mohon lengkapi Nama Pengadu dan Detail Aduan.');
            return;
          }

          const currentPayload = {
            ...formData,
            kontak: '+62 ' + formData.kontak
          };
          const tId = await handleCitizenSubmit(currentPayload);
          setLastTicket(tId);
          setSubmittedData({ ...currentPayload, shortId: tId, id: tId });
          
          // Bersihkan draft tersimpan karena sudah sukses terkirim
          try {
            localStorage.removeItem('sip_citizen_form_draft');
          } catch (e) {}
        };

        return (
          <div className="min-h-screen bg-[#f7f5ee] flex flex-col">
            <NavbarComponent />
            <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
              {lastTicket && submittedData && (
                <div className="mb-6 p-6 bg-emerald-50 border border-emerald-300 rounded-2xl space-y-4 shadow-sm animate-fadeIn">
                  <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                    <div>
                      <div className="text-emerald-950 font-bold text-lg flex items-center gap-2">
                        <span className="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs">✓</span>
                        Pengaduan Berhasil Disimpan & Diterima!
                      </div>
                      <div className="text-emerald-800 text-sm mt-1">Nomor tiket pelacakan Anda: <span className="font-extrabold text-base">{lastTicket}</span></div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => { setTrackId(lastTicket); setView('citizen-tracking'); }} className="px-4 py-2 bg-[#0c4652] text-white rounded-lg text-xs font-semibold shadow">
                        Lacak Status Sekarang →
                      </button>
                      <button onClick={() => { setLastTicket(null); setSubmittedData(null); handleReset(); }} className="px-3 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-xs font-semibold">
                        Buat Aduan Baru
                      </button>

            <div className="max-w-6xl mx-auto space-y-6">

              {/* HALAMAN 1: MANAJEMEN AKUN */}
              {(activeTab === 'Manajemen Akun' || !activeTab) && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h1 className="text-3xl font-bold text-slate-900 tracking-tight">Manajemen Akun</h1>
                      <p className="text-sm text-slate-500 mt-1">Kelola pengguna internal, hak akses role, dan status aktif.</p>
                    </div>
                    <button onClick={() => setShowAddModal(true)} className="py-2.5 px-5 rounded-lg bg-[#b45309] text-white font-semibold text-sm shadow">
                      + Tambah Pengguna
                    </button>
                  </div>

                  <div className="bg-white rounded-2xl border border-[#e4e2da] shadow-sm overflow-hidden">
                    <table className="w-full text-left text-sm">
                      <thead>
                        <tr className="border-b border-slate-200 bg-slate-50/50">
                          <th className="py-3.5 px-6 font-semibold text-xs text-slate-700">Nama</th>
                          <th className="py-3.5 px-6 font-semibold text-xs text-slate-700">Username</th>
                          <th className="py-3.5 px-6 font-semibold text-xs text-slate-700">Role</th>
                          <th className="py-3.5 px-6 font-semibold text-xs text-slate-700">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {users.map(u => (
                          <tr key={u.id} className="hover:bg-slate-50">
                            <td className="py-4 px-6 font-medium text-slate-900">{u.nama}</td>
                            <td className="py-4 px-6 text-slate-600 font-mono text-xs">{u.username}</td>
                            <td className="py-4 px-6">
                              <span className="inline-block px-3 py-1 text-xs font-semibold rounded-full bg-[#cffafe] text-[#0e7490]">
                                {u.role}
                              </span>
                            </td>
                            <td className="py-4 px-6">
                              <div className="flex items-center gap-2">
                                <button onClick={() => notify(`Edit profil ${u.nama}`)} className="py-1.5 px-3 rounded-lg border border-slate-300 text-xs">Edit</button>
                                <button onClick={() => notify(`Password ${u.username} di-reset`)} className="py-1.5 px-3 rounded-lg border border-slate-300 text-xs">Reset Password</button>
                                <button onClick={() => handleToggleStatus(u.id)} className={`py-1.5 px-3 rounded-lg border text-xs ${u.status === 'Aktif' ? 'border-red-400 text-red-600' : 'border-emerald-400 text-emerald-700'}`}>
                                  {u.status === 'Aktif' ? 'Nonaktifkan' : 'Aktifkan'}
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* HALAMAN 2: MASTER KATEGORI */}
              {activeTab === 'Master Kategori' && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-3xl font-bold text-slate-900 tracking-tight">Master Kategori & Seksi</h1>
                    <p className="text-sm text-slate-500 mt-1">Daftar klasifikasi bidang pelayanan dan seksi kelurahan.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-white p-6 rounded-2xl border border-[#e4e2da] shadow-sm space-y-3">
                      <h3 className="font-bold text-slate-900 text-sm">Kategori Pengaduan</h3>
                      {categoriesList.map(c => <div key={c} className="p-3 bg-slate-50 rounded-lg text-xs font-semibold text-slate-700">• {c}</div>)}
                    </div>
                    <div className="bg-white p-6 rounded-2xl border border-[#e4e2da] shadow-sm space-y-3">
                      <h3 className="font-bold text-slate-900 text-sm">Seksi Pelaksana</h3>
                      {sectionsList.map(s => <div key={s} className="p-3 bg-slate-50 rounded-lg text-xs font-semibold text-slate-700">• {s}</div>)}
                    </div>
                  </div>
                </div>
              )}

              {/* HALAMAN 3: KONFIGURASI SISTEM */}
              {activeTab === 'Konfigurasi Sistem' && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-3xl font-bold text-slate-900 tracking-tight">Konfigurasi Sistem</h1>
                    <p className="text-sm text-slate-500 mt-1">Pengaturan identitas kelurahan dan integrasi gateway notifikasi.</p>
                  </div>

                  <div className="bg-white rounded-2xl p-6 border border-[#e4e2da] shadow-sm space-y-4 max-w-xl">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Kelurahan</label>
                      <input type="text" value={conf.kelurahanName} onChange={(e) => setConf(prev => ({ ...prev, kelurahanName: e.target.value }))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">API Notifikasi</label>
                      <input type="text" value={conf.apiNotifikasi} onChange={(e) => setConf(prev => ({ ...prev, apiNotifikasi: e.target.value }))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Limit Berkas</label>
                      <input type="text" value={conf.fileLimit} onChange={(e) => setConf(prev => ({ ...prev, fileLimit: e.target.value }))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm" />
                    </div>
                    <button onClick={() => notify('Konfigurasi sistem berhasil disimpan')} className="py-2.5 px-6 rounded-lg bg-[#0c4652] text-white text-sm font-semibold shadow">
                      Simpan Konfigurasi
                    </button>
                  </div>
                </div>
              )}

              {/* HALAMAN 4: LOG AUDIT */}
              {activeTab === 'Log Audit' && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-3xl font-bold text-slate-900 tracking-tight">Log Audit</h1>
                    <p className="text-sm text-slate-500 mt-1">Jejak aktivitas dan riwayat tindakan petugas internal.</p>
                  </div>

                  <div className="bg-white rounded-2xl p-6 border border-[#e4e2da] shadow-sm space-y-4">
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={logTerm}
                        onChange={(e) => setLogTerm(e.target.value)}
                        placeholder="Cari aktivitas / user..."
                        className="flex-1 px-3.5 py-2 rounded-lg border border-slate-300 text-xs"
                      />
                    </div>

                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-200 bg-slate-50/50">
                          <th className="py-2.5 px-3 font-semibold text-slate-700">Aktivitas</th>
                          <th className="py-2.5 px-3 font-semibold text-slate-700">User</th>
                          <th className="py-2.5 px-3 font-semibold text-slate-700">Waktu</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {auditLogs.filter(l => !logTerm || l.aktivitas.toLowerCase().includes(logTerm.toLowerCase()) || l.user.toLowerCase().includes(logTerm.toLowerCase())).map(l => (
                          <tr key={l.id}>
                            <td className="py-2.5 px-3 font-medium text-slate-800">{l.aktivitas}</td>
                            <td className="py-2.5 px-3 text-slate-600 font-mono">{l.user}</td>
                            <td className="py-2.5 px-3 text-slate-400">{l.waktu}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* Modal Tambah Pengguna */}
          {showAddModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl border border-slate-200">
                <h3 className="text-lg font-bold text-slate-900 mb-4">Tambah Pengguna Baru</h3>
                <form onSubmit={handleAddUser} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" required value={newUser.nama} onChange={(e) => setNewUser(prev => ({ ...prev, nama: e.target.value }))} className="w-full px-3 py-2 rounded-lg border text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                    <input type="text" required value={newUser.username} onChange={(e) => setNewUser(prev => ({ ...prev, username: e.target.value }))} className="w-full px-3 py-2 rounded-lg border text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Role</label>
                    <select value={newUser.role} onChange={(e) => setNewUser(prev => ({ ...prev, role: e.target.value }))} className="w-full px-3 py-2 rounded-lg border text-sm">
                      <option value="Front Office">Front Office</option>
                      <option value="Tindak Lanjut">Tindak Lanjut</option>
                      <option value="Kepala Seksi">Kepala Seksi</option>
                      <option value="Lurah / Seklur">Lurah / Seklur</option>
                      <option value="Administrator">Administrator</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAddModal(false)} className="px-4 py-2 border rounded-lg text-xs font-semibold text-slate-700">Batal</button>
                    <button type="submit" className="px-4 py-2 bg-[#b45309] text-white rounded-lg text-xs font-semibold">Simpan Pengguna</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- MAIN VIEW ROUTER ---
    return (
      <div className="relative min-h-screen">
        {toastMsg && (
          <div className="fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl bg-slate-900 text-white text-sm font-medium border border-slate-700 animate-bounce">
            <span className="w-2.5 h-2.5 rounded-full bg-emerald-400" />
            <span>{toastMsg}</span>
          </div>
        )}

        {view === 'login' && <ScreenLogin />}
        {view === 'citizen-form' && <ScreenCitizenForm />}
        {view === 'citizen-tracking' && <ScreenCitizenTracking />}
        {view === 'front-office' && <ScreenFrontOffice />}
        {view === 'field-officer' && <ScreenFieldOfficer />}
        {view === 'section-head' && <ScreenSectionHead />}
        {view === 'leader-dashboard' && <ScreenLeader />}
        {view === 'admin' && <ScreenAdmin />}

        {/* Global WhatsApp Preview Modal */}
        <WhatsAppModalComponent
          isOpen={waModal.open}
          onClose={() => setWaModal(prev => ({ ...prev, open: false }))}
          complaint={waModal.complaint}
          type={waModal.type}
        />
      </div>
    );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>

</html>
